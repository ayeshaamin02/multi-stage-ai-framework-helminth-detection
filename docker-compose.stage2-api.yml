services:
    stage-2-api:
        build:
            context: api/stage2/
            dockerfile: Dockerfile
        container_name: fecal-detection-stage-2-api
        command: uvicorn app:app --host 0.0.0.0 --port 7138
        ports:
            - "7138:7138"
        environment:
            MODELS_DIR: /app/models
            MAX_CONCURRENT_INFERENCE: "3"
            MAX_CACHED_MODELS: "4"
        restart: unless-stopped
